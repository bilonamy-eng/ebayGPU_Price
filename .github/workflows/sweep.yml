name: eBay API sweep
on:
  schedule:
    - cron: "17 * * * *"      # 每小时一次；脚本自己跳过阿姆斯特丹 02:00–08:00
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sweep
  cancel-in-progress: false
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Query eBay and render board
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: python3 sweep.py --wide --board ${{ github.event_name == 'schedule' && '--gate' || '' }}
      - name: Commit board
        run: |
          git add index.html api_sweep_latest.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update board $(TZ=Europe/Amsterdam date '+%Y-%m-%d %H:%M') (Amsterdam) via eBay API"
          git push
