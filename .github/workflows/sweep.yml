name: eBay API sweep
on:
  schedule:
    - cron: "2,17,32,47 * * * *"   # GitHub 定时经常延迟或漏跑，所以每 15 分钟触发；脚本保证两轮至少间隔 50 分钟，并跳过阿姆斯特丹 02:00–08:00
  workflow_dispatch:
    inputs:
      args:
        description: "调试用：直接传给 sweep.py 的参数（留空 = 正常跑一轮并更新行情板）"
        default: ""
permissions:
  contents: write
concurrency:
  group: sweep
  cancel-in-progress: false
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Query eBay and render board
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: python3 sweep.py ${{ inputs.args || format('--wide --board {0}', github.event_name == 'schedule' && '--gate --min-interval=50' || '') }}
      - name: Commit board
        run: |
          if [ -n "${{ inputs.args }}" ]; then echo "debug run, nothing committed"; exit 0; fi
          git add index.html api_sweep_latest.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update board $(TZ=Europe/Amsterdam date '+%Y-%m-%d %H:%M') (Amsterdam) via eBay API"
          git push
